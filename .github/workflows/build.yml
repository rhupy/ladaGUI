name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src/src-tauri

      - name: Install frontend dependencies
        working-directory: src
        run: npm install

      - name: Run tests
        working-directory: src/src-tauri
        run: cargo test

      - name: Build Tauri app
        working-directory: src
        # Signing the updater artifacts needs these; without them the build
        # still succeeds but produces no .sig, and auto-update silently breaks.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            src/src-tauri/target/release/bundle/msi/*.msi
            src/src-tauri/target/release/bundle/nsis/*.exe
            src/src-tauri/target/release/bundle/nsis/*.sig

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      # The updater fetches this one file and compares its version with the
      # running app, so it has to name the exact installer asset and carry the
      # signature inline — a URL to the .sig does not work.
      - name: Build updater manifest
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP=$(find artifacts -name '*-setup.exe' | head -1)
          SIG=$(find artifacts -name '*-setup.exe.sig' | head -1)
          if [ -z "$SETUP" ] || [ -z "$SIG" ]; then
            echo "::error::missing installer or signature (setup='$SETUP' sig='$SIG')"
            find artifacts -type f
            exit 1
          fi
          ASSET=$(basename "$SETUP")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET// /.}"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "$SIG")" \
            --arg url "$URL" \
            '{version:$version, notes:"See the release notes.", pub_date:$pub_date,
              platforms:{"windows-x86_64":{signature:$signature, url:$url}}}' \
            > artifacts/latest.json
          cat artifacts/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
